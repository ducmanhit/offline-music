name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS project
        run: flutter create . --platforms=ios --org com.ducmanhit --project-name cloud_music_offline

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Patch iOS runner
        run: |
          cp ios_native/AppDelegate.swift ios/Runner/AppDelegate.swift
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Cloud Music" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" ios/Runner/Info.plist || true

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS app without signing
        run: flutter build ios --release --no-codesign --build-number "${{ github.run_number }}"

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -qry CloudMusicOffline-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudMusicOffline-unsigned-IPA
          path: build/ios/ipa/CloudMusicOffline-unsigned.ipa
